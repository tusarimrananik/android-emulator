services:
  - type: web
    name: android-emulator-renderer
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:renderer && npx remotion browser ensure
    startCommand: npm run start:renderer
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://android-emulator-blush.vercel.app
      - key: RENDER_TTL_MS
        value: "86400000"
      - key: RENDER_OUTPUT_DIR
        value: /opt/render/project/src/render-output
